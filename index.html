<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Transformation</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(180deg, #020b1f, #020617);
    color: white;
}

h1 {
    text-align: center;
}

.container {
    display: flex;
    justify-content: space-between;
    padding: 40px;
    gap: 40px;
}

.box {
    width: 30%;
}

.preview {
    width: 100%;
    height: 400px;
    border: 2px solid #555;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.center {
    width: 40%;
}

textarea {
    width: 100%;
    height: 120px;
    border-radius: 10px;
    padding: 10px;
    border: none;
    font-size: 16px;
}

select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 18px;
    cursor: pointer;
    margin-top: 10px;
}

.download {
    background: #16a34a;
}
</style>
</head>

<body>

<h1>🔥 AI Transformation</h1>

<div class="container">

    <!-- LEFT -->
    <div class="box">
        <input type="file" id="imageInput">

        <div class="preview" id="inputPreview">
            preview
        </div>
    </div>

    <!-- CENTER -->
    <div class="center">

        <label>Aspect Ratio</label>
        <select id="ratio">
            <option value="1:1">1:1</option>
            <option value="9:16" selected>9:16</option>
            <option value="4:5">4:5</option>
            <option value="5:4">5:4</option>
            <option value="3:4">3:4</option>
        </select>

        <label>Prompt</label>
        <textarea id="prompt" placeholder="Write your transformation prompt..."></textarea>

        <button onclick="generate()">Generate</button>

    </div>

    <!-- RIGHT -->
    <div class="box">
        <div class="preview" id="resultPreview">
            preview
        </div>

        <button class="download" onclick="downloadImage()">Download</button>
    </div>

</div>

<script>

let resultUrl = "";

// preview input image
document.getElementById("imageInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);

    document.getElementById("inputPreview").innerHTML =
        `<img src="${url}">`;
});

// generate
async function generate() {

    const file = document.getElementById("imageInput").files[0];
    const prompt = document.getElementById("prompt").value;
    const ratio = document.getElementById("ratio").value;

    if (!file) return alert("Upload image first");
    if (!prompt) return alert("Enter prompt");

    const formData = new FormData();
    formData.append("image", file);
    formData.append("prompt", prompt);
    formData.append("ratio", ratio);

    document.getElementById("resultPreview").innerHTML = "⏳ Generating...";

    const res = await fetch("https://YOUR-BACKEND.onrender.com/generate", {
        method: "POST",
        body: formData
    });

    const data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    resultUrl = data.image_url;

    document.getElementById("resultPreview").innerHTML =
        `<img src="${resultUrl}">`;
}

// download
function downloadImage() {
    if (!resultUrl) return alert("No image yet");

    const a = document.createElement("a");
    a.href = resultUrl;
    a.download = "result.png";
    a.click();
}

</script>

</body>
</html>
