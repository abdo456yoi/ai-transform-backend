<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Transformation</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #000428, #004e92);
    color: white;
}

h1 {
    text-align: center;
    margin-top: 20px;
}

.container {
    display: flex;
    gap: 30px;
    padding: 40px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
}

.card {
    background: #0b1a2a;
    padding: 20px;
    border-radius: 15px;
    width: 100%;
    max-width: 320px;
    text-align: center;
}

img {
    width: 100%;
    border-radius: 12px;
    margin-top: 10px;
}

#resultPreview {
    width: 100%;
    min-height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
}

textarea, select {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

button {
    margin-top: 15px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

/* MOBILE */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
        align-items: center;
    }
}
</style>
</head>

<body>

<h1>🔥 AI Transformation</h1>

<div class="container">

    <!-- INPUT -->
    <div class="card">
        <input type="file" id="imageInput">

        <img id="inputPreview" />

        <select id="ratio">
            <option value="9:16">9:16 (TikTok)</option>
            <option value="5:4">5:4</option>
            <option value="4:3">4:3</option>
            <option value="3:2">3:2</option>
            <option value="1:1">1:1</option>
        </select>

        <textarea id="prompt" rows="6">
same person, identical face, do not change identity, preserve natural skin texture, clear strong visible weight loss transformation, realistic body proportions, same background, photorealistic
        </textarea>

        <button onclick="generate()">Generate</button>
    </div>

    <!-- RESULT -->
    <div class="card">
        <div id="resultPreview">Result here</div>
        <button onclick="downloadImage()">Download</button>
    </div>

</div>

<script>
let resultUrl = "";

// 🔥 IMAGE PREVIEW
document.getElementById("imageInput").onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById("inputPreview").src =
        URL.createObjectURL(file);
};

// 🚀 GENERATE
async function generate() {

    const file = document.getElementById("imageInput").files[0];
    const prompt = document.getElementById("prompt").value;
    const ratio = document.getElementById("ratio").value;

    if (!file) return alert("Upload image first");

    const formData = new FormData();
    formData.append("image", file);
    formData.append("prompt", prompt);
    formData.append("ratio", ratio);

    document.getElementById("resultPreview").innerHTML =
        "⏳ Generating... (wait 20–40s first time)";

    try {
        const res = await fetch("https://ai-transform-backend.onrender.com/generate", {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        console.log("API:", data);

        if (data.error) {
            alert(data.error);
            document.getElementById("resultPreview").innerHTML = "❌ Error";
            return;
        }

        resultUrl = data.image_url;

        document.getElementById("resultPreview").innerHTML =
            `<img src="${resultUrl}">`;

    } catch (err) {
        console.error(err);
        alert("Backend sleeping or error");
    }
}

// ⬇️ DOWNLOAD
function downloadImage() {
    if (!resultUrl) return alert("Generate image first");

    const a = document.createElement("a");
    a.href = resultUrl;
    a.download = "result.png";
    a.click();
}
</script>

</body>
</html>
