<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Transformation</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.title {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: #0b1220;
    padding: 20px;
    border-radius: 15px;
}

textarea {
    width: 100%;
    height: 80px;
    margin-top: 10px;
    border-radius: 10px;
    padding: 10px;
    border: none;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

.result-img {
    width: 100%;
    border-radius: 10px;
}

@media (max-width: 768px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="title">🔥 AI Transformation</div>

    <div class="grid">

        <!-- LEFT -->
        <div class="card">
            <input type="file" id="imageInput">

            <textarea id="prompt">body transformation</textarea>

            <button onclick="generate()">Generate</button>
        </div>

        <!-- RIGHT -->
        <div class="card">
            <h3>Result</h3>
            <img id="resultImage" class="result-img" style="display:none;">
        </div>

    </div>
</div>

<script>
const API_URL = "https://ai-transform-backend.onrender.com/generate";

async function generate() {
    const file = document.getElementById("imageInput").files[0];
    const prompt = document.getElementById("prompt").value;

    if (!file) {
        alert("Upload image first");
        return;
    }

    const formData = new FormData();
    formData.append("image", file);
    formData.append("prompt", prompt);

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (data.image_url) {
            const resultImage = document.getElementById("resultImage");
            resultImage.src = data.image_url;
            resultImage.style.display = "block";
        } else {
            alert("Error: " + JSON.stringify(data));
        }

    } catch (err) {
        alert("Request failed");
    }
}
</script>

</body>
</html>
