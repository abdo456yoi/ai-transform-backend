<!DOCTYPE html>
<html>
<head>
  <title>AI Transformation</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* MAIN CONTAINER (SIDE BY SIDE) */
    .container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }

    /* LEFT = FORM */
    .card {
      background: #111827;
      padding: 30px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    /* RIGHT = RESULT */
    .result-box {
      background: #111827;
      padding: 20px;
      border-radius: 20px;
      width: 350px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    h1 {
      margin-bottom: 20px;
    }

    .upload-box {
      border: 2px dashed #374151;
      padding: 20px;
      border-radius: 15px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .upload-box:hover {
      background: #1f2937;
    }

    input[type="file"] {
      display: none;
    }

    select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
    }

    button {
      background: #22c55e;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    .loader {
      margin-top: 10px;
    }

    .download {
      margin-top: 10px;
      color: #22c55e;
      text-decoration: none;
      font-size: 14px;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- LEFT SIDE (FORM) -->
  <div class="card">

    <h1>🔥 AI Transformation</h1>

    <label class="upload-box">
      Click to upload image
      <input type="file" id="image" onchange="preview()">
    </label>

    <img id="preview" style="display:none"/>

   <textarea id="prompt" placeholder="Describe your transformation...
Example: athletic body, lose fat, visible abs, realistic transformation"
style="
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-bottom:15px;
  resize:none;
  height:100px;
"></textarea>

    <button onclick="upload()">Generate</button>

    <div id="status" class="loader"></div>

  </div>

  <!-- RIGHT SIDE (RESULT) -->
  <div class="result-box" id="resultBox">
    <p>No result yet</p>
  </div>

</div>

<script>
function preview() {
  let file = document.getElementById("image").files[0];
  let img = document.getElementById("preview");
  img.src = URL.createObjectURL(file);
  img.style.display = "block";
}

async function upload() {
  let file = document.getElementById("image").files[0];
  if (!file) return alert("Upload image first");

  let formData = new FormData();
  formData.append("image", file);
  formData.append("prompt", document.getElementById("prompt").value);

  document.getElementById("status").innerText = "⏳ Generating...";

  let res = await fetch("https://ai-transform-backend.onrender.com/generate", {
    method: "POST",
    body: formData
  });

  let data = await res.json();

  document.getElementById("status").innerText = "✅ Done";

  let box = document.getElementById("resultBox");

  if (data.image_url) {
    box.innerHTML = `
      <img src="${data.image_url}" style="
  width:100%;
  aspect-ratio:9/16;
  object-fit:cover;
  border-radius:10px;
" />
      <a class="download" href="${data.image_url}" target="_blank">⬇ Download</a>
    `;
  } else {
    box.innerHTML = "<p>Error generating image</p>";
  }
}
</script>

</body>
</html>
