<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Transformation</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.title {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* CARD */
.card {
    background: #0b1220;
    padding: 20px;
    border-radius: 15px;
}

/* IMAGE PREVIEW */
.preview {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
}

/* RESULT IMAGE */
.result-img {
    width: 100%;
    border-radius: 10px;
}

/* TEXTAREA */
textarea {
    width: 100%;
    height: 80px;
    margin-top: 10px;
    border-radius: 10px;
    padding: 10px;
    border: none;
}

/* BUTTON */
button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #22c55e;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

/* LOADING */
.loading {
    text-align: center;
    margin-top: 20px;
    display: none;
}

/* MOBILE */
@media (max-width: 768px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="title">🔥 AI Transformation</div>

    <div class="grid">

        <!-- LEFT SIDE -->
        <div class="card">
            <input type="file" id="imageInput">

            <img id="preview" class="preview" style="display:none;">

            <textarea id="prompt">body transformation</textarea>

            <button onclick="generate()">Generate</button>
        </div>

        <!-- RIGHT SIDE -->
        <div class="card">
            <h3>Result</h3>

            <div class="loading" id="loading">⏳ Generating...</div>

            <img id="resultImage" class="result-img" style="display:none;">
        </div>

    </div>
</div>

<script>
const API_URL = "https://ai-transform-backend.onrender.com/generate";

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const resultImage = document.getElementById("resultImage");
const loading = document.getElementById("loading");

// Preview image
imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];
    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }
});

// Generate
async function generate() {
    const file = imageInput.files[0];
    const prompt = document.getElementById("prompt").value;

    if (!file) {
        alert("Upload image first");
        return;
    }

    const formData = new FormData();
    formData.append("image", file);
    formData.append("prompt", prompt);

    // Show loading
    loading.style.display = "block";
    resultImage.style.display = "none";

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        loading.style.display = "none";

        if (data.image_url) {
            resultImage.src = data.image_url;
            resultImage.style.display = "block";
        } else {
            alert("Error: " + JSON.stringify(data));
        }

    } catch (err) {
        loading.style.display = "none";
        alert("Request failed");
    }
}
</script>

</body>
</html>
