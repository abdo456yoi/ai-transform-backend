<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Transformation</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .container {
      max-width: 400px;
      margin: auto;
    }

    input, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    img {
      margin-top: 20px;
      width: 100%;
      border-radius: 10px;
    }

    #loading {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔥 AI Transformation</h1>

    <input type="file" id="imageInput" />

    <textarea id="promptInput">body transformation</textarea>

    <button onclick="generateImage()">Generate</button>

    <p id="loading">⏳ Generating...</p>

    <img id="resultImage" />
  </div>

  <script>
    async function generateImage() {
      const fileInput = document.getElementById("imageInput");
      const promptInput = document.getElementById("promptInput");
      const resultImage = document.getElementById("resultImage");
      const loading = document.getElementById("loading");

      if (!fileInput.files[0]) {
        alert("Upload image first");
        return;
      }

      const formData = new FormData();
      formData.append("image", fileInput.files[0]);
      formData.append("prompt", promptInput.value);

      loading.style.display = "block";

      try {
        const response = await fetch("https://ai-transform-backend.onrender.com/generate", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        console.log(data);

        if (data.image_url) {
          resultImage.src = data.image_url;
        } else {
          alert("Error: " + (data.error || "Unknown error"));
        }

      } catch (error) {
        alert("Request failed");
        console.error(error);
      }

      loading.style.display = "none";
    }
  </script>

</body>
</html>
